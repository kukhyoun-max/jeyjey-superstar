<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>재생 시험</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; background: #2f6fdc; color: #fff; font: 15px/1.5 system-ui, sans-serif; padding: 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { margin: 0 0 12px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 10px; }
  button { font: inherit; font-weight: 700; border: 0; border-radius: 12px; padding: 12px; background: #fff; color: #15233f; flex: 1; }
  button.on { background: #ffd93b; }
  #frame { width: 100%; aspect-ratio: 9/16; background: #15233f; border-radius: 14px; overflow: hidden; }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
  .row { display: flex; gap: 8px; margin: 10px 0 18px; }
  input { font: inherit; width: 100%; box-sizing: border-box; border: 0; border-radius: 12px; padding: 12px; margin-bottom: 8px; }
  #log { background: rgba(0,0,0,.25); padding: 10px; border-radius: 12px; white-space: pre-wrap; word-break: break-all; font-size: 13px; min-height: 40px; }
</style>
</head>
<body>
<h1>앱 안 재생 시험</h1>
<p>플랫폼을 눌러 영상을 재생해 보세요. 앱을 떠나지 않고 소리까지 나오는지, 버튼이 가려지지 않는지 봅니다.</p>
<div class="tabs">
  <button data-p="instagram">인스타1</button>
  <button data-p="instagram2">인스타2</button>
  <button data-p="youtube">유튜브</button>
  <button data-p="tiktok">틱톡</button>
</div>
<div id="frame"></div>
<div class="row"><button>아니에요</button><button class="on">좋아요</button></div>

<input id="custom" placeholder="다른 영상 링크를 넣어 시험하기">
<div class="row" style="margin-top:0"><button id="load">이 링크 재생</button><button id="paste">붙여넣기 시험</button></div>
<div class="row" style="margin-top:0"><button id="share">공유 시험</button><button id="store">기억 시험</button></div>
<div id="log">기록이 여기에 나옵니다.</div>

<script src="embed.js"></script>
<script>
  const SAMPLES = {
    instagram: { platform: 'instagram', id: 'De_m5HoTw7A', url: 'https://www.instagram.com/reel/De_m5HoTw7A/' },
    instagram2: { platform: 'instagram', id: 'DdV6ChQKfb1', url: 'https://www.instagram.com/reel/DdV6ChQKfb1/' },
    youtube: { platform: 'youtube', id: 'p6kY8-yTCwA', url: 'https://www.youtube.com/watch?v=p6kY8-yTCwA' },
    tiktok: null
  };
  const $ = (id) => document.getElementById(id);
  const log = (m) => { $('log').textContent = m; };

  function show(link) {
    const e = embedFor(link);
    $('frame').textContent = '';
    if (!e) { log('이 링크는 임베드를 만들 수 없습니다.'); return; }
    const f = document.createElement('iframe');
    f.src = e.src;
    f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
    f.allowFullscreen = true;
    $('frame').appendChild(f);
    log('불러온 주소: ' + e.src);
  }

  function parse(raw) {
    let m;
    if ((m = raw.match(/instagram\.com\/(?:reel|reels|p)\/([\w-]+)/))) return { platform: 'instagram', id: m[1], url: raw };
    if ((m = raw.match(/(?:youtu\.be\/|shorts\/|[?&]v=)([\w-]+)/))) return { platform: 'youtube', id: m[1], url: raw };
    if ((m = raw.match(/tiktok\.com\/.*video\/(\d+)/))) return { platform: 'tiktok', id: m[1], url: raw };
    return null;
  }

  document.querySelectorAll('[data-p]').forEach((b) => b.onclick = () => {
    document.querySelectorAll('[data-p]').forEach((x) => x.classList.toggle('on', x === b));
    if (SAMPLES[b.dataset.p]) show(SAMPLES[b.dataset.p]);
    else { $('frame').textContent = ''; log('틱톡 앱에서 공개 영상 링크를 복사해 아래 칸에 넣고 「이 링크 재생」을 눌러 주세요.'); }
  });
  $('load').onclick = () => show(parse($('custom').value.trim()));
  $('paste').onclick = async () => {
    try { const t = await navigator.clipboard.readText(); $('custom').value = t; log('붙여넣기 성공: ' + t); }
    catch (e) { log('붙여넣기 실패: ' + e.name); }
  };
  $('share').onclick = async () => {
    if (!navigator.share) { log('이 브라우저는 공유 창을 지원하지 않습니다.'); return; }
    try { await navigator.share({ text: '재생 시험입니다', url: location.href }); log('공유 창 열림'); }
    catch (e) { log('공유 결과: ' + e.name); }
  };
  $('store').onclick = () => {
    try {
      const v = localStorage.getItem('lab') || '';
      localStorage.setItem('lab', new Date().toLocaleString('ko-KR'));
      log(v ? '이전 기억 있음: ' + v : '처음입니다. 새로고침 후 다시 눌러 보세요.');
    } catch (e) { log('기억 실패: ' + e.name); }
  };
  document.querySelector('[data-p]').click();
</script>
</body>
</html>
